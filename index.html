<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Spavio AI" />
  <meta name="theme-color" content="#761DEA" />

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Manrope:wght@200..800&display=swap"

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="500x500" href="/icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!--
    Page-specific SEO tags. `npm run build` prerenders every storefront page and
    replaces this block with that page's title, description, canonical, hreflang,
    Open Graph and JSON-LD tags. These defaults only apply to client-only routes.
  -->
  <!--seo-->
  <title data-rh="true">Spavio AI Store | Smarte Beauty- &amp; Körperpflege-Geräte</title>
  <meta data-rh="true" name="description"
    content="Entdecke den Spavio AI Store – LED-Lichttherapie-Masken, Microcurrent- und RF-Geräte für die Haut, IPL-Haarentfernung, Ionen-Haarstyling und Wellness-Geräte. Beauty-Technologie in Klinik-Qualität für zu Hause.">
  <meta data-rh="true" property="og:site_name" content="Spavio AI Store" />
  <meta data-rh="true" property="og:type" content="website" />
  <meta data-rh="true" property="og:title" content="Spavio AI Store | Smarte Beauty- &amp; Körperpflege-Geräte">
  <meta data-rh="true" property="og:image" content="https://spavioai.store/og-image.jpg" />
  <meta data-rh="true" name="twitter:card" content="summary_large_image" />
  <!--/seo-->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
